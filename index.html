<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Attendance</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        label { display: block; margin-bottom: 4px; font-size: 14px; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>Add Attendance</h2>
    <form id="dataForm">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Student Name" required>

        <label for="date">Date</label>
        <input type="date" id="date" required>

        <label for="subjectName">Subject Name</label>
        <input type="text" id="subjectName" placeholder="Subject Name" required>

        <label for="section">Section</label>
        <input type="text" id="section" placeholder="Section" required>

        <button type="submit">Submit to Database</button>
    </form>

    <h2>Attendance Records</h2>
    <div id="recordsContainer">Loading...</div>

    <script>
        const VERCEL_API_URL = 'https://student-api-backend-beta.vercel.app/api/index';

        // Default the date picker to today
        function setToday() {
            const t = new Date();
            const local = new Date(t.getTime() - t.getTimezoneOffset() * 60000);
            document.getElementById('date').value = local.toISOString().slice(0, 10);
        }

        async function loadRecords() {
            const container = document.getElementById('recordsContainer');
            try {
                const response = await fetch(VERCEL_API_URL);
                const records = await response.json();

                container.innerHTML = '';

                if (!Array.isArray(records) || records.length === 0) {
                    container.innerHTML = '<p>No records found.</p>';
                    return;
                }

                records.forEach(record => {
                    const div = document.createElement('div');
                    div.className = 'card';

                    const strong = document.createElement('strong');
                    strong.textContent = record.studentName || '(no name)';
                    div.appendChild(strong);
                    div.appendChild(document.createElement('br'));

                    const dateText = record.date
                        ? new Date(record.date).toISOString().slice(0, 10)
                        : '(no date)';
                    div.appendChild(document.createTextNode(
                        'Date: ' + dateText
                    ));
                    div.appendChild(document.createElement('br'));
                    div.appendChild(document.createTextNode(
                        'Subject: ' + (record.subjectName || '-')
                    ));
                    div.appendChild(document.createElement('br'));
                    div.appendChild(document.createTextNode(
                        'Section: ' + (record.section || '-')
                    ));

                    container.appendChild(div);
                });
            } catch (error) {
                container.innerText = 'Error loading records.';
            }
        }

        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const studentName = document.getElementById('studentName').value;
            const date = document.getElementById('date').value;
            const subjectName = document.getElementById('subjectName').value;
            const section = document.getElementById('section').value;

            try {
                const res = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentName, date, subjectName, section })
                });
                if (!res.ok) throw new Error('Request failed');

                // Clear the form (keep today's date) and reload records
                document.getElementById('dataForm').reset();
                setToday();
                loadRecords();
            } catch (error) {
                alert('Failed to submit record.');
            }
        });

        setToday();
        loadRecords();
    </script>
</body>
</html>
