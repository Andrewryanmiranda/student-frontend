<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas: #edf1f6;
            --paper: #ffffff;
            --ink: #14213d;
            --muted: #5b6b82;
            --rule: #d5deea;
            --focus: #2f6feb;
            --present: #1e7b57;  --present-bg: #e3f3ec;
            --absent:  #a63a33;  --absent-bg:  #f9e6e4;
            --late:    #8a5a00;  --late-bg:    #fbf0d9;
            --display: "Bricolage Grotesque", "Trebuchet MS", Arial, sans-serif;
            --body: "Instrument Sans", "Segoe UI", Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--canvas);
            color: var(--ink);
            font-family: var(--body);
            font-size: 16px;
            line-height: 1.5;
        }

        .page { max-width: 1040px; margin: 0 auto; padding: 40px 20px 64px; }

        header { margin-bottom: 28px; }
        h1 {
            margin: 0 0 4px;
            font-family: var(--display);
            font-size: clamp(2rem, 4vw, 2.75rem);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        header p { margin: 0; color: var(--muted); max-width: 52ch; }

        .layout {
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            gap: 32px;
            align-items: start;
        }

        /* ---------- Form ---------- */
        .form-panel {
            position: sticky;
            top: 24px;
            background: var(--paper);
            border: 1px solid var(--rule);
            border-top: 4px solid var(--ink);
            border-radius: 12px;
            padding: 22px 20px 20px;
        }
        .form-panel h2, .register h2 {
            margin: 0 0 16px;
            font-family: var(--display);
            font-size: 1.25rem;
            letter-spacing: -0.01em;
        }

        label, legend {
            display: block;
            margin: 0 0 6px;
            padding: 0;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .field { margin-bottom: 16px; }
        fieldset.field { border: 0; margin-left: 0; margin-right: 0; min-width: 0; }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            font: inherit;
            color: var(--ink);
            background: #fff;
            border: 1px solid #aebbd0;
            border-radius: 8px;
        }
        input::placeholder { color: #8795aa; }

        :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

        /* Status as a segmented control */
        .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .segmented input { position: absolute; opacity: 0; pointer-events: none; }
        .segmented label {
            margin: 0;
            padding: 9px 6px;
            text-align: center;
            font-weight: 500;
            border: 1px solid #aebbd0;
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }
        .segmented input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
        .segmented input[value="Present"]:checked + label { background: var(--present-bg); border-color: var(--present); color: var(--present); font-weight: 600; }
        .segmented input[value="Absent"]:checked  + label { background: var(--absent-bg);  border-color: var(--absent);  color: var(--absent);  font-weight: 600; }
        .segmented input[value="Late"]:checked    + label { background: var(--late-bg);    border-color: var(--late);    color: var(--late);    font-weight: 600; }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: var(--ink);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        button[type="submit"]:hover { background: #22345c; }
        button[type="submit"]:disabled { background: #6b7a93; cursor: wait; }

        .form-msg { min-height: 1.5em; margin: 12px 0 0; font-size: 0.9rem; }
        .form-msg.ok  { color: var(--present); }
        .form-msg.err { color: var(--absent); }

        /* ---------- Register ---------- */
        .register {
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 12px;
            overflow: hidden;
        }
        .register-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 22px 14px;
            border-bottom: 1px solid var(--rule);
        }
        .register-head h2 { margin: 0; }
        .count { color: var(--muted); font-size: 0.9rem; }

        .student { padding: 16px 22px 18px; border-bottom: 1px solid var(--rule); }
        .student:last-child { border-bottom: 0; }

        .student-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 12px;
            margin-bottom: 10px;
        }
        .student-name { margin: 0; font-weight: 600; font-size: 1.05rem; }
        .subject { color: var(--muted); }
        .section {
            padding: 1px 9px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--ink);
            border: 1px solid #aebbd0;
            border-radius: 999px;
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 4px 10px 4px 8px;
            font-size: 0.85rem;
            border-radius: 6px;
        }
        .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .chip .st { font-weight: 600; }
        .chip.present { color: var(--present); background: var(--present-bg); }
        .chip.absent  { color: var(--absent);  background: var(--absent-bg); }
        .chip.late    { color: var(--late);    background: var(--late-bg); }
        .chip .when { color: var(--ink); }

        .state { padding: 28px 22px; color: var(--muted); }

        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
            .form-panel { position: static; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>Attendance</h1>
            <p>Record which students attended each class, and see every date on file.</p>
        </header>

        <div class="layout">
            <section class="form-panel" aria-labelledby="formTitle">
                <h2 id="formTitle">Add attendance</h2>
                <form id="dataForm">
                    <div class="field">
                        <label for="studentName">Student name</label>
                        <input type="text" id="studentName" placeholder="e.g. Paolo Garcia" autocomplete="off" required>
                    </div>

                    <div class="field">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="field">
                        <label for="subjectName">Subject name</label>
                        <input type="text" id="subjectName" placeholder="e.g. Database Systems" autocomplete="off" required>
                    </div>

                    <div class="field">
                        <label for="section">Section</label>
                        <input type="text" id="section" placeholder="e.g. BSIT-3B" autocomplete="off" required>
                    </div>

                    <fieldset class="field">
                        <legend>Status</legend>
                        <div class="segmented">
                            <input type="radio" name="status" id="st-present" value="Present" checked>
                            <label for="st-present">Present</label>
                            <input type="radio" name="status" id="st-absent" value="Absent">
                            <label for="st-absent">Absent</label>
                            <input type="radio" name="status" id="st-late" value="Late">
                            <label for="st-late">Late</label>
                        </div>
                    </fieldset>

                    <button type="submit" id="saveBtn">Save attendance</button>
                    <p class="form-msg" id="formMsg" role="status" aria-live="polite"></p>
                </form>
            </section>

            <section class="register" aria-labelledby="registerTitle">
                <div class="register-head">
                    <h2 id="registerTitle">Attendance records</h2>
                    <span class="count" id="count"></span>
                </div>
                <div id="recordsContainer"><p class="state">Loading records…</p></div>
            </section>
        </div>
    </div>

    <script>
        const VERCEL_API_URL = 'https://student-api-backend-beta.vercel.app/api/index';

        // Default the date picker to today
        function setToday() {
            const t = new Date();
            const local = new Date(t.getTime() - t.getTimezoneOffset() * 60000);
            document.getElementById('date').value = local.toISOString().slice(0, 10);
        }

        function formatDate(value) {
            return new Date(value).toLocaleDateString('en-GB', {
                day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'
            });
        }

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        async function loadRecords() {
            const container = document.getElementById('recordsContainer');
            const count = document.getElementById('count');
            try {
                const response = await fetch(VERCEL_API_URL);
                const records = await response.json();

                container.innerHTML = '';

                if (!Array.isArray(records) || records.length === 0) {
                    count.textContent = '';
                    container.appendChild(el('p', 'state', 'No attendance saved yet. Add the first record with the form.'));
                    return;
                }

                count.textContent = records.length + (records.length === 1 ? ' student' : ' students');

                records.forEach(record => {
                    const row = el('article', 'student');

                    const top = el('div', 'student-top');
                    top.appendChild(el('h3', 'student-name', record.studentName || '(no name)'));
                    top.appendChild(el('span', 'subject', record.subjectName || '-'));
                    top.appendChild(el('span', 'section', record.section || '-'));
                    row.appendChild(top);

                    const list = el('ul', 'chips');
                    const dates = Array.isArray(record.dates) ? record.dates : [];
                    dates
                        .slice()
                        .sort((a, b) => new Date(b.date) - new Date(a.date))
                        .forEach(d => {
                            const status = d.status || 'Present';
                            const cls = status.toLowerCase();
                            const li = el('li', 'chip ' + (['present', 'absent', 'late'].includes(cls) ? cls : 'present'));
                            li.appendChild(el('span', 'dot'));
                            li.appendChild(el('span', 'when', formatDate(d.date)));
                            li.appendChild(el('span', 'st', status));
                            list.appendChild(li);
                        });
                    row.appendChild(list);

                    container.appendChild(row);
                });
            } catch (error) {
                count.textContent = '';
                container.innerHTML = '';
                container.appendChild(el('p', 'state', "Couldn't load records. Check your connection and refresh the page."));
            }
        }

        function showMessage(text, kind) {
            const msg = document.getElementById('formMsg');
            msg.textContent = text;
            msg.className = 'form-msg ' + kind;
        }

        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('saveBtn');
            const body = {
                studentName: document.getElementById('studentName').value.trim(),
                date: document.getElementById('date').value,
                subjectName: document.getElementById('subjectName').value.trim(),
                section: document.getElementById('section').value.trim(),
                status: document.querySelector('input[name="status"]:checked').value
            };

            btn.disabled = true;
            btn.textContent = 'Saving…';
            showMessage('', '');

            try {
                const res = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error('Request failed');

                // Keep date, subject, section and status so the next student is quick to add
                const nameInput = document.getElementById('studentName');
                nameInput.value = '';
                nameInput.focus();
                showMessage('Saved attendance for ' + body.studentName + '.', 'ok');
                loadRecords();
            } catch (error) {
                showMessage("Couldn't save. Check your connection and try again.", 'err');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save attendance';
            }
        });

        setToday();
        loadRecords();
    </script>
</body>
</html>
