<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas: #edf1f6;
            --paper: #ffffff;
            --ink: #14213d;
            --muted: #5b6b82;
            --rule: #d5deea;
            --focus: #2f6feb;
            --present: #1e7b57;  --present-bg: #e3f3ec;
            --absent:  #a63a33;  --absent-bg:  #f9e6e4;
            --late:    #8a5a00;  --late-bg:    #fbf0d9;
            --display: "Bricolage Grotesque", "Trebuchet MS", Arial, sans-serif;
            --body: "Instrument Sans", "Segoe UI", Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--canvas);
            color: var(--ink);
            font-family: var(--body);
            font-size: 16px;
            line-height: 1.5;
        }

        .page { max-width: 1100px; margin: 0 auto; padding: 40px 20px 64px; }

        header { margin-bottom: 24px; }
        h1 {
            margin: 0 0 4px;
            font-family: var(--display);
            font-size: clamp(1.9rem, 4vw, 2.6rem);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        header p { margin: 0; color: var(--muted); max-width: 60ch; }

        h2 {
            margin: 0;
            font-family: var(--display);
            font-size: 1.25rem;
            letter-spacing: -0.01em;
        }

        .panel {
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 12px;
        }

        label, legend {
            display: block;
            margin: 0 0 6px;
            padding: 0;
            font-size: 0.875rem;
            font-weight: 600;
        }
        fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

        input[type="text"], input[type="date"], input[type="search"] {
            width: 100%;
            padding: 10px 12px;
            font: inherit;
            color: var(--ink);
            background: #fff;
            border: 1px solid #aebbd0;
            border-radius: 8px;
        }
        input::placeholder { color: #8795aa; }
        :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

        /* ---------- Segmented status control ---------- */
        .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .segmented input { position: absolute; opacity: 0; pointer-events: none; }
        .segmented label {
            margin: 0;
            padding: 9px 6px;
            text-align: center;
            font-weight: 500;
            border: 1px solid #aebbd0;
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }
        .segmented input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
        .segmented input[value="Present"]:checked + label { background: var(--present-bg); border-color: var(--present); color: var(--present); font-weight: 600; }
        .segmented input[value="Absent"]:checked  + label { background: var(--absent-bg);  border-color: var(--absent);  color: var(--absent);  font-weight: 600; }
        .segmented input[value="Late"]:checked    + label { background: var(--late-bg);    border-color: var(--late);    color: var(--late);    font-weight: 600; }

        /* ---------- Buttons ---------- */
        .btn {
            padding: 11px 18px;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: var(--ink);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .btn:hover { background: #22345c; }
        .btn:disabled { background: #6b7a93; cursor: wait; }
        .btn.ghost { color: var(--ink); background: #fff; border: 1px solid #aebbd0; }
        .btn.ghost:hover { background: #f2f5f9; }

        .ok  { color: var(--present); }
        .err { color: var(--absent); }
        .msg { min-height: 1.4em; margin: 10px 0 0; font-size: 0.9rem; }

        /* ---------- Add form ---------- */
        .add-panel { padding: 20px 22px 18px; margin-bottom: 24px; border-top: 4px solid var(--ink); }
        .add-panel h2 { margin-bottom: 16px; }
        .add-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px 16px;
            align-items: end;
        }

        /* ---------- Records ---------- */
        .records-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--rule); }
        .records-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .count { color: var(--muted); font-size: 0.9rem; }
        .viewbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; }
        .viewbar .f-date input { width: 180px; }
        .viewbar .f-search { flex: 1 1 220px; max-width: 320px; }
        .summary { margin: 10px 0 0; font-size: 0.9rem; color: var(--muted); }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 720px; }
        th {
            padding: 11px 16px;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            background: #f6f8fb;
            border-bottom: 1px solid var(--rule);
            white-space: nowrap;
        }
        td { padding: 12px 16px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: #fafbfd; }
        td.name { font-weight: 600; }
        td.num { white-space: nowrap; }
        th.actions, td.actions { text-align: right; white-space: nowrap; }

        .section-badge {
            display: inline-block;
            padding: 1px 9px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #aebbd0;
            border-radius: 999px;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 3px 10px 3px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
        }
        .status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .status.present { color: var(--present); background: var(--present-bg); }
        .status.absent  { color: var(--absent);  background: var(--absent-bg); }
        .status.late    { color: var(--late);    background: var(--late-bg); }

        .link-btn {
            padding: 5px 11px;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--ink);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }
        .link-btn:hover { background: #eef2f7; border-color: var(--rule); }
        .link-btn.danger { color: var(--absent); }
        .link-btn.danger:hover { background: var(--absent-bg); border-color: transparent; }

        .state { padding: 28px 22px; color: var(--muted); margin: 0; }

        /* ---------- Edit dialog ---------- */
        dialog {
            width: min(460px, calc(100vw - 32px));
            padding: 22px 20px 20px;
            color: var(--ink);
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 12px;
        }
        dialog::backdrop { background: rgba(20, 33, 61, 0.45); }
        dialog h3 { margin: 0 0 4px; font-family: var(--display); font-size: 1.2rem; }
        dialog .sub { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; }
        dialog .field { margin-bottom: 14px; }
        .dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>Attendance Management Portal</h1>
            <p>Add, review, correct and remove class attendance records without touching the database.</p>
        </header>

        <!-- ===== CREATE ===== -->
        <section class="panel add-panel" aria-labelledby="addTitle">
            <h2 id="addTitle">Add attendance record</h2>
            <form id="addForm">
                <div class="add-grid">
                    <div>
                        <label for="studentName">Student name</label>
                        <input type="text" id="studentName" placeholder="e.g. Paolo Garcia" autocomplete="off" required>
                    </div>
                    <div>
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div>
                        <label for="subjectName">Subject name</label>
                        <input type="text" id="subjectName" placeholder="e.g. Database Systems" autocomplete="off" required>
                    </div>
                    <div>
                        <label for="section">Section</label>
                        <input type="text" id="section" placeholder="e.g. BSIT-3B" autocomplete="off" required>
                    </div>
                    <fieldset>
                        <legend>Status</legend>
                        <div class="segmented">
                            <input type="radio" name="status" id="st-present" value="Present" checked>
                            <label for="st-present">Present</label>
                            <input type="radio" name="status" id="st-absent" value="Absent">
                            <label for="st-absent">Absent</label>
                            <input type="radio" name="status" id="st-late" value="Late">
                            <label for="st-late">Late</label>
                        </div>
                    </fieldset>
                    <div>
                        <button type="submit" class="btn" id="addBtn" style="width:100%">Save attendance</button>
                    </div>
                </div>
                <p class="msg" id="addMsg" role="status" aria-live="polite"></p>
            </form>
        </section>

        <!-- ===== READ ===== -->
        <section class="panel" aria-labelledby="recordsTitle">
            <div class="records-head">
                <div class="records-title">
                    <h2 id="recordsTitle">Attendance records</h2>
                    <span class="count" id="count"></span>
                </div>
                <div class="viewbar">
                    <div class="f-date">
                        <label for="viewDate">View date</label>
                        <input type="date" id="viewDate">
                    </div>
                    <div class="f-search">
                        <label for="search">Search student</label>
                        <input type="search" id="search" placeholder="Type a name" autocomplete="off">
                    </div>
                    <button type="button" class="btn ghost" id="clearBtn">Show all</button>
                </div>
                <p class="summary" id="summary"></p>
                <p class="msg" id="listMsg" role="status" aria-live="polite"></p>
            </div>
            <div id="recordsContainer"><p class="state">Loading records…</p></div>
        </section>
    </div>

    <!-- ===== UPDATE dialog ===== -->
    <dialog id="editDialog" aria-labelledby="editTitle">
        <h3 id="editTitle">Edit attendance record</h3>
        <p class="sub">Name, subject and section changes apply to all of this student's dates.</p>
        <form id="editForm">
            <div class="field">
                <label for="editName">Student name</label>
                <input type="text" id="editName" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="editSubject">Subject name</label>
                <input type="text" id="editSubject" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="editSection">Section</label>
                <input type="text" id="editSection" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="editDate">Date</label>
                <input type="date" id="editDate" required>
            </div>
            <fieldset class="field">
                <legend>Status</legend>
                <div class="segmented">
                    <input type="radio" name="editStatus" id="es-present" value="Present">
                    <label for="es-present">Present</label>
                    <input type="radio" name="editStatus" id="es-absent" value="Absent">
                    <label for="es-absent">Absent</label>
                    <input type="radio" name="editStatus" id="es-late" value="Late">
                    <label for="es-late">Late</label>
                </div>
            </fieldset>
            <div class="dialog-actions">
                <button type="submit" class="btn" id="editSaveBtn">Save changes</button>
                <button type="button" class="btn ghost" id="editCancelBtn">Cancel</button>
            </div>
            <p class="msg" id="editMsg" role="status" aria-live="polite"></p>
        </form>
    </dialog>

    <script>
        const VERCEL_API_URL = 'https://student-api-backend-beta.vercel.app/api/index';

        let records = [];   // documents from the API
        let editing = null; // row currently being edited

        /* ---------- helpers ---------- */
        const isoDay = (value) => new Date(value).toISOString().slice(0, 10);

        const formatDate = (value) =>
            new Date(value).toLocaleDateString('en-GB', {
                day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'
            });

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function setMsg(id, text, kind) {
            const node = document.getElementById(id);
            node.textContent = text;
            node.className = 'msg' + (kind ? ' ' + kind : '');
        }

        function setToday() {
            const t = new Date();
            const local = new Date(t.getTime() - t.getTimezoneOffset() * 60000);
            document.getElementById('date').value = local.toISOString().slice(0, 10);
        }

        async function request(method, query, body) {
            const res = await fetch(VERCEL_API_URL + (query || ''), {
                method,
                headers: body ? { 'Content-Type': 'application/json' } : undefined,
                body: body ? JSON.stringify(body) : undefined
            });
            let data = null;
            try { data = await res.json(); } catch (e) { /* no body */ }
            if (!res.ok) throw new Error((data && data.error) || 'Request failed');
            return data;
        }

        // One table row per student per date
        function flatten() {
            const rows = [];
            records.forEach(r => {
                (r.dates || []).forEach(d => {
                    rows.push({
                        id: r._id,
                        studentName: r.studentName || '',
                        subjectName: r.subjectName || '',
                        section: r.section || '',
                        date: isoDay(d.date),
                        status: d.status || 'Present'
                    });
                });
            });
            rows.sort((a, b) =>
                b.date.localeCompare(a.date) || a.studentName.localeCompare(b.studentName));
            return rows;
        }

        /* ---------- READ ---------- */
        async function loadRecords() {
            try {
                const data = await request('GET');
                records = Array.isArray(data) ? data : [];
                render();
            } catch (error) {
                document.getElementById('count').textContent = '';
                document.getElementById('summary').textContent = '';
                const box = document.getElementById('recordsContainer');
                box.innerHTML = '';
                box.appendChild(el('p', 'state', "Couldn't load records. Check your connection and refresh the page."));
            }
        }

        function render() {
            const box = document.getElementById('recordsContainer');
            const count = document.getElementById('count');
            const summary = document.getElementById('summary');
            const viewDate = document.getElementById('viewDate').value;
            const query = document.getElementById('search').value.trim().toLowerCase();

            box.innerHTML = '';
            summary.textContent = '';

            const all = flatten();
            if (all.length === 0) {
                count.textContent = '';
                box.appendChild(el('p', 'state', 'No attendance records yet. Add the first one with the form above.'));
                return;
            }

            let rows = all;
            if (viewDate) rows = rows.filter(r => r.date === viewDate);
            if (query) rows = rows.filter(r => r.studentName.toLowerCase().includes(query));

            const filtered = Boolean(viewDate || query);
            count.textContent = filtered
                ? rows.length + ' of ' + all.length + ' records'
                : all.length + (all.length === 1 ? ' record' : ' records');

            if (viewDate) {
                const tally = { Present: 0, Absent: 0, Late: 0 };
                rows.forEach(r => { if (tally[r.status] !== undefined) tally[r.status]++; });
                const parts = ['Present', 'Absent', 'Late']
                    .filter(k => tally[k] > 0)
                    .map(k => tally[k] + ' ' + k.toLowerCase());
                summary.textContent = formatDate(viewDate) + ': ' + (parts.length ? parts.join(', ') : 'no attendance saved');
            }

            if (rows.length === 0) {
                box.appendChild(el('p', 'state', 'No records match your filters.'));
                return;
            }

            const wrap = el('div', 'table-wrap');
            const table = el('table');
            const thead = el('thead');
            const hr = el('tr');
            ['Student name', 'Subject', 'Section', 'Date', 'Status', 'Actions'].forEach(h => {
                const th = el('th', h === 'Actions' ? 'actions' : '', h);
                th.scope = 'col';
                hr.appendChild(th);
            });
            thead.appendChild(hr);
            table.appendChild(thead);

            const tbody = el('tbody');
            rows.forEach(row => {
                const tr = el('tr');
                tr.appendChild(el('td', 'name', row.studentName));
                tr.appendChild(el('td', '', row.subjectName));

                const secTd = el('td');
                secTd.appendChild(el('span', 'section-badge', row.section));
                tr.appendChild(secTd);

                tr.appendChild(el('td', 'num', formatDate(row.date)));

                const stTd = el('td');
                const cls = row.status.toLowerCase();
                const badge = el('span', 'status ' + (['present', 'absent', 'late'].includes(cls) ? cls : 'present'));
                badge.appendChild(el('span', 'dot'));
                badge.appendChild(document.createTextNode(row.status));
                stTd.appendChild(badge);
                tr.appendChild(stTd);

                const act = el('td', 'actions');
                const editBtn = el('button', 'link-btn', 'Edit');
                editBtn.type = 'button';
                editBtn.setAttribute('aria-label', 'Edit ' + row.studentName + ', ' + formatDate(row.date));
                editBtn.addEventListener('click', () => openEdit(row));
                const delBtn = el('button', 'link-btn danger', 'Delete');
                delBtn.type = 'button';
                delBtn.setAttribute('aria-label', 'Delete ' + row.studentName + ', ' + formatDate(row.date));
                delBtn.addEventListener('click', () => deleteRow(row));
                act.appendChild(editBtn);
                act.appendChild(delBtn);
                tr.appendChild(act);

                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            wrap.appendChild(table);
            box.appendChild(wrap);
        }

        document.getElementById('viewDate').addEventListener('change', render);
        document.getElementById('search').addEventListener('input', render);
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('viewDate').value = '';
            document.getElementById('search').value = '';
            render();
        });

        /* ---------- CREATE ---------- */
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('addBtn');
            const body = {
                studentName: document.getElementById('studentName').value.trim(),
                date: document.getElementById('date').value,
                subjectName: document.getElementById('subjectName').value.trim(),
                section: document.getElementById('section').value.trim(),
                status: document.querySelector('input[name="status"]:checked').value
            };

            btn.disabled = true;
            btn.textContent = 'Saving…';
            setMsg('addMsg', '', '');

            try {
                await request('POST', '', body);

                // Keep date, subject, section and status so the next student is quick to add
                const nameInput = document.getElementById('studentName');
                nameInput.value = '';
                nameInput.focus();
                setMsg('addMsg', 'Saved attendance for ' + body.studentName + '.', 'ok');
                await loadRecords();
            } catch (error) {
                setMsg('addMsg', "Couldn't save. " + error.message + '.', 'err');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save attendance';
            }
        });

        /* ---------- UPDATE ---------- */
        const editDialog = document.getElementById('editDialog');

        function openEdit(row) {
            editing = row;
            document.getElementById('editName').value = row.studentName;
            document.getElementById('editSubject').value = row.subjectName;
            document.getElementById('editSection').value = row.section;
            document.getElementById('editDate').value = row.date;
            const radio = document.querySelector('input[name="editStatus"][value="' + row.status + '"]')
                || document.getElementById('es-present');
            radio.checked = true;
            setMsg('editMsg', '', '');
            editDialog.showModal();
        }

        document.getElementById('editCancelBtn').addEventListener('click', () => editDialog.close());

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('editSaveBtn');
            btn.disabled = true;
            setMsg('editMsg', '', '');
            try {
                await request('PUT', '', {
                    id: editing.id,
                    date: editing.date,
                    newDate: document.getElementById('editDate').value,
                    status: document.querySelector('input[name="editStatus"]:checked').value,
                    studentName: document.getElementById('editName').value.trim(),
                    subjectName: document.getElementById('editSubject').value.trim(),
                    section: document.getElementById('editSection').value.trim()
                });
                editDialog.close();
                setMsg('listMsg', 'Record updated.', 'ok');
                await loadRecords();
            } catch (error) {
                setMsg('editMsg', "Couldn't save changes. " + error.message + '.', 'err');
            } finally {
                btn.disabled = false;
            }
        });

        /* ---------- DELETE ---------- */
        async function deleteRow(row) {
            const ok = confirm(
                'Delete the record for ' + row.studentName + ' on ' + formatDate(row.date) + '? This cannot be undone.'
            );
            if (!ok) return;
            try {
                await request('DELETE', '?id=' + encodeURIComponent(row.id) +
                    '&date=' + encodeURIComponent(row.date));
                setMsg('listMsg', 'Deleted the record for ' + row.studentName + ' on ' + formatDate(row.date) + '.', 'ok');
                await loadRecords();
            } catch (error) {
                setMsg('listMsg', "Couldn't delete. " + error.message + '.', 'err');
            }
        }

        /* ---------- start ---------- */
        setToday();
        loadRecords();
    </script>
</body>
</html>
